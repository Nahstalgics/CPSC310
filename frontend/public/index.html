<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>InsightUBC - Add Section</title>
	<link rel="stylesheet" href="index.css">
</head>
<body>
<header>
	<h1>Welcome to InsightUBC - Sections!</h1>
</header>

<main>
	<p>Let's manipulate some data!</p>

	<section id="addSection">
		<h2>Add New Dataset</h2>
		<label for="sectionId">Section ID:</label>
		<input type="text" id="sectionId" placeholder="Enter section ID">

		<label for="sectionFile">Choose File:</label>
		<input type="file" id="sectionFile">

		<button id="addSectionBtn">Add</button>
	</section>

	<section id="addedSections">
		<h2>Added Sections</h2>
		<ul id="sectionsList">
			<!-- Added sections will appear here -->
		</ul>
	</section>

	<section id="insightSection">
		<h2>Dataset Insights</h2>

		<div class="insight-buttons">
			<!-- Now always visible -->
			<div id="graph1Controls" style="margin-top: 10px;">
				<label for="graph1DeptSelect">Choose Department:</label>
				<select id="graph1DeptSelect"></select>
			</div>


			<button id="graph1Btn">Courses with Highest Averages</button>
			<button id="graph2Btn">Professors With Highest Averages</button>
			<button id="graph3Btn">Show Graph 3</button>
		</div>

		<div style="width: 600px; height: 350px; margin-top: 20px;">
			<canvas id="insightChart"></canvas>
		</div>
	</section>
</main>

<footer>
	<p>&copy; 2025 Colin Yang, Michelle Mantel</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="index.js"></script>
</body>
</html>
